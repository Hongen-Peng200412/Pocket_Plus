global_batch_size: 40
enable_batch_size_tuning: false
tuning_init_batch_size: 10
batch_size: 5
batch_size_tuning_safety_factor: 0.9
tuning_steps_per_trial: 10
strict_global_batch_size: false
num_workers: 20
dataloader_backend: auto
pin_memory: true
seed: 3407
seed_workers: true
dataloader_seed_offsets:
  train: 0
  val: 1
use_balanced_foreground_sampler: true
balanced_foreground_ratio: 0.33
data_fault_tolerance:
  enabled: true
  stages:
  - train
  - val
  max_resample_attempts: 8
  sample_timeout_sec: 200
  log_first_n: 50
nnodes: 1
devices: 1
max_epochs: 20
accelerator: auto
ddp_find_unused_parameters: false
precision: bf16-mixed
gradient_clip_val: 0.5
check_val_every_n_epoch: 1
val_per_epoch: 1
log_every_n_steps: 3
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3.0e-05
  weight_decay: 0.01
scheduler:
  name: warmup_plateau
  total_steps: null
  warmup_steps: null
  warmup_ratio: 0.06
  warmup_start_factor: 0.33
  mode: ${model.monitor_mode}
  factor: 0.5
  patience: 3
  threshold: 0.002
  threshold_mode: abs
  cooldown: 0
  min_lr: 0.0
  eps: 1.0e-08

