    _partial_: true
    lr: 3.0e-05
    weight_decay: 0.01
  scheduler:
    name: warmup_plateau
    total_steps: null
    warmup_steps: null
    warmup_ratio: 0.06
    warmup_start_factor: 0.33
    mode: ${model.monitor_mode}
    factor: 0.5
    patience: 3
    threshold: 0.002
    threshold_mode: abs
    cooldown: 0
    min_lr: 0.0
    eps: 1.0e-08
name: MINI_real_front
tag: MINI_real_front
project_name: PV_detach
