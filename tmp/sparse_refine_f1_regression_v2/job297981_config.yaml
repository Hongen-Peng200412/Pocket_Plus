  atom_buffer_radius: 8.0
  cache_size: 128
  valid_crop_margin: 0
  enable_random_rotation: true
post_process:
  name: none
output:
  save_top_k: 10
  save_every_n_epochs: 3
  visualization:
    enabled: false
train:
  global_batch_size: 40
  enable_batch_size_tuning: false
  tuning_init_batch_size: 10
  batch_size: 5
  batch_size_tuning_safety_factor: 0.9
  tuning_steps_per_trial: 10
  strict_global_batch_size: false
  num_workers: 20
  dataloader_backend: auto
  pin_memory: true
  seed: 3407
  seed_workers: true
  dataloader_seed_offsets:
    train: 0
    val: 1
  use_balanced_foreground_sampler: true
  balanced_foreground_ratio: 0.33
  data_fault_tolerance:
    enabled: true
    stages:
    - train
    - val
    max_resample_attempts: 8
    sample_timeout_sec: 200
    log_first_n: 50
  nnodes: 1
  devices: 1
  max_epochs: 20
  accelerator: auto
  ddp_find_unused_parameters: false
  precision: bf16-mixed
  gradient_clip_val: 0.5
  check_val_every_n_epoch: 1
  val_per_epoch: 1
  log_every_n_steps: 3
  optimizer:
