  class_mapping:
  - 0
  - 1
  - 1
  - 1
  - 1
  class_names:
  - background
  - foreground
  num_task_classes: 2
  split_train:
  - /storage/penghongen/Pocket_classic/v2_raw4_10A/split/split_3/metal_ion/train_010.json
  - /storage/penghongen/Pocket_classic/v2_raw4_10A/split/split_3/peptide/train_010.json
  - /storage/penghongen/Pocket_classic/v2_raw4_10A/split/split_3/nucleic/train_010.json
  - /storage/penghongen/Pocket_classic/v2_raw4_10A/split/split_3/small_molecule/train_010.json
  - /storage/penghongen/Pocket_classic/v2_raw4_10A/split/split_3/random_BOX/train_010.json
  split_val:
