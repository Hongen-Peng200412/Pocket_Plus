# @package _global_
# ============================================================
# 二分类 sparse refine 四路损失配置
# 此文件通过 experiment defaults 覆盖 cfg.model.* 下的 loss 字段。
#   → train.py: hydra.utils.instantiate(cfg.model, optimizer=..., scheduler=...)
#   → VoxelPointStage1Wrapper.__init__: instantiate(atom/voxel/sparse refine loss)
# ============================================================

model:
  # --- atom loss: 受体原子二分类辅助监督 ---
  atom_loss:
    _target_: src.modules.losses.AdaptiveClassificationCompositeLoss
    num_classes: 2
    sigma: 2.0
    hard_label_threshold: null
    focal_gamma: 2.0
    focal_alpha: [0.5, 0.5]
    focal_alpha_neg: 0.5
    focal_alpha_pos: 0.5
    focal_eps: 1.0e-6
    tversky_alpha: 0.5
    tversky_beta: 0.5
    tversky_smooth: 1.0
    w_focal: 0.7
    w_tversky: 0.3
    w_mse: 0.0
    focal_soft_negative_suppression: false
    tversky_soft_target: false
  # 最终 atom head 单分支监督。
  atom_loss_weight: 1.0         # float, atom loss 权重

  # --- voxel auxiliary loss: 体素二分类辅助监督 ---
  voxel_aux_loss:
    _target_: src.modules.losses.AdaptiveClassificationCompositeLoss
    num_classes: 2
    sigma: 2.0
    hard_label_threshold: null
    focal_gamma: 2.0
    focal_alpha: [0.5, 0.5]
    focal_alpha_neg: 0.5
    focal_alpha_pos: 0.5
    focal_eps: 1.0e-6
    tversky_alpha: 0.5
    tversky_beta: 0.5
    tversky_smooth: 1.0
    w_focal: 0.7
    w_tversky: 0.3
    w_mse: 0.0
    focal_soft_negative_suppression: false
    tversky_soft_target: false
  voxel_aux_loss_weight: 0.1

  # --- voxel ligand loss: refine 前 dense ligand 监督 ---
  voxel_ligand_loss:
    _target_: src.modules.losses.AdaptiveClassificationCompositeLoss
    num_classes: 2
    sigma: 2.0
    hard_label_threshold: 1.7
    focal_gamma: 2.0
    focal_alpha: [0.5, 0.5]
    focal_alpha_neg: 0.5
    focal_alpha_pos: 0.5
    focal_eps: 1.0e-6
    tversky_alpha: 0.5
    tversky_beta: 0.5
    tversky_smooth: 1.0
    w_focal: 0.7
    w_tversky: 0.3
    w_mse: 0.0
    focal_soft_negative_suppression: false
    tversky_soft_target: false
  voxel_ligand_loss_weight: 1.0



  # --- ligand sparse refine loss: C 级 refined logits 分类监督 L_cls ---
  # recall-biased 纯 Tversky(w_focal=0, alpha=0.3<beta=0.7 偏召回); 与 ligand_pseudo_loss 同源同配比。
  ligand_sparse_refine_loss:
    _target_: src.modules.losses.AdaptiveClassificationCompositeLoss
    num_classes: 2
    sigma: 2.0
    hard_label_threshold: 1.7
    focal_gamma: 0.0
    focal_alpha: [0.3, 0.7]
    focal_alpha_neg: 0.3
    focal_alpha_pos: 0.7
    focal_eps: 1.0e-6
    tversky_alpha: 0.3
    tversky_beta: 0.7
    tversky_smooth: 1.0
    w_focal: 0.0
    w_tversky: 1.0
    w_mse: 0.0
    focal_soft_negative_suppression: false
    tversky_soft_target: false
  ligand_sparse_refine_loss_weight: 1.0




  # --- ligand sparse refine delta loss: 相对 base 改进的 ranking-only 辅助项 ---
  #   → VoxelPointStage1Wrapper._compute_total_loss(): 与 L_cls 合成单个 ligand_sparse_refine term,
  #     共用 schedule; base 仅用 candidate_prob(已 detach) 做难例挖掘。
  ligand_sparse_refine_delta_loss:
    _target_: src.modules.losses.LigandSparseRefineDeltaLoss
    m_rank: 0.5       # float, ranking margin
    topk: 512         # int, ranking 每 BOX 各取的难正例 Kp 与难负例 Kn(对称难例挖掘)
  ligand_sparse_refine_w_rank: 0.3  # float, ranking(L_rank)权重; 0 时退化为纯分类(消融 A3)





  # --- ligand pseudo loss: P(虚拟原子) ligand 区域归属监督(单通道 sigmoid) ---
  # 与 ligand_sparse_refine_loss(L_cls)同源同配比(recall-biased 纯 Tversky)。
  ligand_pseudo_loss:
    _target_: src.modules.losses.AdaptiveClassificationCompositeLoss
    num_classes: 2
    sigma: 2.0
    hard_label_threshold: 1.7
    focal_gamma: 0.0
    focal_alpha: [0.5, 0.5]
    focal_alpha_neg: 0.5
    focal_alpha_pos: 0.5
    focal_eps: 1.0e-6
    tversky_alpha: 0.5
    tversky_beta: 0.5
    tversky_smooth: 1.0
    w_focal: 0.7
    w_tversky: 0.3
    w_mse: 0.0
    focal_soft_negative_suppression: false
    tversky_soft_target: false
  pseudo_loss_weight: 0.0       # float, pseudo loss 权重; P 损失从头开、不走 warmup





  # --- sparse refine loss 独立调度 ---
  #   → VoxelPointStage1Wrapper._compute_sparse_refine_loss_effective_weight():
  #     global_step < start_on 时硬等于 0(refine 块完全不训练); [start_on, warmup] 线性升; ≥ warmup 取 final_weight。
  #     要求 start_on ≤ warmup, 否则 fail-fast。
  ligand_sparse_refine_loss_schedule:
    mode: linear_warmup
    start_weight: 0.0
    final_weight: ${model.ligand_sparse_refine_loss_weight}
    warmup_steps: null            # int|null, 显式 warmup 步数; null 时用 warmup_ratio*total_steps
    warmup_ratio: 0.2             # float, warmup 步数占总训练步数比例
    start_on_steps: null          # int|null, 显式硬 0 延迟步数; null 时用 start_on_ratio
    start_on_ratio: 0.1           # float|null, 硬 0 延迟占总训练步数比例; 前 10% 步 refine 三损失完全不训练
