# @package _global_
# ============================================================
# P anchor sampler: topk_nms
# 此文件写入 cfg.model.backbone.anchor_sampler_cfg。
# 从已唯一化的候选 C 中按 BOX/路由类别采样 P anchors, 类别与预算来自 model/task preset。
#   → VolumePointStage1Model.__init__: instantiate(anchor_sampler_cfg) 构造 SparseAnchorSampler。
#   → VolumePointStage1Model._prepare_pseudo_batch(): anchor_sampler(candidate_outputs, batch) 生成 P 坐标与 metadata。
#   → SparseAnchorSampler._sample_topk_nms_one_group(): 使用 dense grid + max_pool3d 做局部极大筛选。
# ============================================================
model:
  backbone:
    anchor_sampler_cfg:
      # _target_: str, P anchor 采样器类全称; Hydra 据此实例化 nn.Module
      _target_: src.model.sparse_refine.anchor_sampler.SparseAnchorSampler
      mode: topk_nms                                                              # str, dense grid + max_pool3d 局部极大采样
      candidate_class_ids: ${sparse_refine_task.candidate_class_ids}       # list[int], 候选前景类别 ID; 必须与 candidate_set_cfg 一致
      max_anchors_per_class: ${sparse_refine_task.max_anchors_per_class} # list[int], 每 BOX/类别 P anchor 上限
      weight_power: 1.0          # float, weighted_fps 概率权重指数; topk_nms 下仅为构造函数统一字段
      chunk_size: 8192           # int, weighted_fps 距离更新 chunk; topk_nms 主路径不使用
      nms_radius_voxel: 2        # int, 局部最大池化半径, 单位 voxel; 0 时退化为 per-class top-k
      random_start: false        # bool, unweighted_fps 的起点随机开关; topk_nms 主路径不使用
