# @package _global_
# ============================================================
# Density cube: 仅真实原子 density 调制; 伪原子(P anchor) density 关闭
# 写入 real_atom_density_cube=true + 独立 real_density_cube_cfg, density_cube_cfg=null。
# 真实原子 density 通路不依赖 anchor_sampler, 可脱离 sparse refine 单独使用。
#   → VolumePointStage1Model.__init__: instantiate(real_density_cube_cfg) 构造独立 DensityCubeEncoder。
#   → train.py::_initialize_lazy_modules_before_ddp(): in_channels=null 时按首个 dataset 样本 lazy 设置 raw voxel_grid 通道数。
#   → VolumePointStage1Model._apply_real_atom_density_to_atom_feat(): encoder(voxel_grid, home_zyx, atom_batch_index, cube_size=real_atom_density_cube_size)。
# ============================================================
model:
  backbone:
    density_cube_cfg: null                       # null, 不启用伪原子 density(无 sparse refine 时本就必须为 null)
    real_atom_density_cube: true                 # bool, 启用真实原子 density cube 调制
    real_atom_density_share_encoder: false       # bool, 用独立 encoder(real_density_cube_cfg), 不复用伪原子 encoder
    real_atom_density_cube_size: 9               # int, 真实原子 cube 边长(奇数), 与 real_density_cube_cfg.cube_size 对齐
    real_atom_density_combine_mode: film_plus    # str, embed<->density 融合; concat_mlp/film/film_plus/mini_residue
    real_atom_density_fusion_mlp_ratio: 2.0      # float, real density 融合 MLP 隐藏层膨胀倍率(film 不使用)
    real_atom_density_fusion_proj_drop: 0.2      # float, real density 融合 MLP dropout; 仅 concat_mlp/mini_residue/film_plus 生效
    real_density_cube_cfg:
      # _target_: str, density cube encoder 类全称; Hydra 据此实例化 nn.Module
      _target_: src.model.sparse_refine.density_cube.DensityCubeEncoder
      in_channels: null  # int|null, batch["voxel_grid"] 原始通道数; null 表示训练启动前 lazy 初始化
      cube_size: 9       # int, 真实原子周围 cube 边长, 必须为 >=1 的奇数; 与 real_atom_density_cube_size 对齐
      hidden_channels: 64 # int, Conv3d hidden 通道数; norm=group 时必须能被 num_groups 整除
      num_downsample: 2  # int, stride=2 下采样 Conv3d block 数; 用于控制 cube 内卷积开销
      num_conv: 1        # int, 下采样后的普通 stride=1 Conv3d block 数; 真实原子量大, 减为 1 省显存
      out_dim: ${model.backbone.point_backbone.atom_feature_dim} # int, 输出维度, 必须等于 point backbone atom_feature_dim
      encoder_type: conv_gap # str, encoder 类型; 当前只支持 conv_gap
      norm: group        # str, 归一化类型; 取值 group/none
      num_groups: 8      # int, GroupNorm group 数; hidden_channels 必须整除该值
      act: silu          # str, 激活函数; 取值 silu/relu/gelu
      chunk_size: 2048   # int, 每次抽取/编码的真实原子数; 用于控制临时 cube 张量显存
