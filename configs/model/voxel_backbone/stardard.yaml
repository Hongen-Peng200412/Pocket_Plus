# @package _global_
# 体素分支变体: RAUNet-64 (基线)
model:
  backbone:
    voxel_backbone:
      _target_: src.model.stage1_voxel_backbone.Stage1VoxelBackbone
      in_channels: null              # int|null, 输入通道数; null=运行时自动推断
      feature_channels: 48           # int, 体素分支最终输出的通道(将会进入 atom head)
      enable_multiscale_output: true # bool, true=使用 3/5/7 多尺度卷积；false=直接使用最高分辨率解码特征
      enable_structure_heads: false # bool, 是否构造蛋白、核酸与最近配体距离三个新增输出头
      planes: [64, 256, 256, 256, 256, 256, 128, 64, 64]
                                     # list[int], RAUNet 各层通道数
                                     #   映射: (enc0, enc1, enc2, enc3, bottleneck, dec3, dec2, dec1, dec0)
      gradient_checkpoint: true      # bool, 梯度检查点以节省显存
      # return_feature_keys: ["voxel_ds_2", "voxel_ds_3", "voxel_c4", "voxel_final"]
      #                                # list[str], 返回的中间特征名称; 被 point_fusion_map 引用
      return_feature_keys: []        # 做好防护了: 取其所需

      voxel_aux_logit_dim: 1         # int, voxel_aux_head 输出通道数; 1=单通道 sigmoid 二分类, >1=softmax 多分类
                                     # → Stage1VoxelBackbone.__init__: 决定 voxel_logits_aux 的 channel 维, 需与 voxel_aux_loss.num_classes 对齐

      voxel_ligand_logit_dim: 1      # int, voxel_ligand_head 输出通道数; 1=单通道 sigmoid 二分类, >1=softmax 多分类
                                     # → Stage1VoxelBackbone.__init__: 决定 voxel_logits_ligand 的 channel 维, 需与 voxel_ligand_loss.num_classes 对齐
      prior_probs: null              # list[float]|null, 多通道 softmax head 的类别先验概率; null 表示不做多分类 bias 初始化
                                     # → Stage1VoxelBackbone.__init__: 非 null 时同时初始化 aux/ligand head 最后一层 Conv3d bias
      # 五个逐体素输出头都固定为 Conv1x1(C,C) → ReLU → Conv1x1(C,C_out)。
