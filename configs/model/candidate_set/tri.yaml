# @package _global_
# ============================================================
# 三分类 ligand sparse candidate set 配置
# cfg.model.backbone.candidate_set_cfg 由 VolumePointStage1Model.__init__ 通过 Hydra instantiate 构造
# ============================================================
model:
  backbone:
    candidate_set_cfg:
      # _target_: str, 目标类全称; VolumePointStage1Model.__init__ 据此实例化候选集合生成器
      _target_: src.model.sparse_refine.candidate_set.SparseCandidateSetBuilder
      selection_mode: adaptive_threshold      # str, warmup 后候选选择模式; adaptive_threshold 使用 per-box best-F1 扩张 topk
      candidate_class_ids: [1, 2]             # list[int], 前景候选类别 ID; 顺序与下方 per-class 参数一一对应
      warmup_topc_per_class: [256, 2048]      # list[int], warmup 阶段每个 BOX/类别固定候选数上限
      adaptive_expand_factor: [10.0, 10.0]    # list[float], adaptive_threshold 下相对 p_best 正例数量的扩张倍数
      max_candidate_voxels_per_class: [3000, 30000]  # list[int], 每个 BOX/类别最终候选行上限
