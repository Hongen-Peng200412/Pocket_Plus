# @package _global_
# ============================================================
# 二分类 sparse candidate set 配置
# cfg.model.backbone.candidate_set_cfg 由 VolumePointStage1Model.__init__ 通过 Hydra instantiate 构造
# ============================================================
model:
  backbone:
    candidate_set_cfg:
      # _target_: str, 目标类全称; VolumePointStage1Model.__init__ 据此实例化候选集合生成器
      _target_: src.model.sparse_refine.candidate_set.SparseCandidateSetBuilder
      selection_mode: adaptive_threshold       # str, warmup 后候选选择模式; adaptive_threshold 使用 per-box best-F1 扩张 topk
      candidate_class_ids: [1]                 # list[int], 二分类单前景类别 ID; 单通道 sigmoid 路径只允许 [1]
      warmup_topc_per_class: [2048]            # list[int], warmup 阶段每个 BOX/类别固定候选数上限
      adaptive_expand_factor: [10.0]           # list[float], adaptive_threshold 下相对 p_best 正例数量的扩张倍数
      max_candidate_voxels_per_class: [30000]  # list[int], 每个 BOX/类别最终候选行上限
