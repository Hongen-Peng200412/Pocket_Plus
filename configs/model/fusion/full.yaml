# @package _global_
# 融合逻辑变体: Dense 4-hook — film_plus + weighted_cube
model:
  backbone:
    point_fusion_map:
      point_enc2: voxel_ds_2       # 编码器第 2 层
      point_enc3: voxel_ds_3       # 编码器第 3 层
      point_enc4: voxel_ds_4         # 编码器第 4 层
      point_dec4: voxel_c4       # 解码器第 4 层
      point_dec3: voxel_c3       # 解码器第 3 层
      point_dec2: voxel_c2         # 解码器第 2 层
      point_dec1: voxel_c1         # 解码器第 1 层
      point_feat: voxel_final      # 最终输出
    point_fusion_modes: ["film_plus", "film_plus", "film_plus", "film_plus", "film_plus", "film_plus", "film_plus", "film_plus"]
                                   # list[str], "film_plus"=MLP 生成 gamma/beta 的 FiLM 调制
    sampler_modes: ["weighted_cube", "weighted_cube", "weighted_cube", "weighted_cube", "weighted_cube", "weighted_cube", "weighted_cube", "weighted_cube"]
                                   # list[str], "weighted_cube"=3^3 邻域可学习加权池化
    sampler_cube_init:
      - [2.0, 1.5, 0.5, 1.0]     # point_dec4: home / 含原子 / 其他 / 温度
      - [2.0, 1.5, 0.5, 1.0]     # point_dec3
      - [2.0, 1.5, 0.5, 1.0]     # point_dec2
      - [2.0, 1.5, 0.5, 1.0]     # point_dec1
      - [2.0, 1.5, 0.5, 1.0]
      - [2.0, 1.5, 0.5, 1.0]
      - [2.0, 1.5, 0.5, 1.0]
      - [2.0, 1.5, 0.5, 1.0]
    fusion_mlp_ratio: 2.0         # float, concat_mlp / mini_residue / film_plus 隐藏层膨胀倍率
    fusion_proj_drop: 0.2         # float, concat_mlp / mini_residue / film_plus 融合 MLP dropout; film 不使用
    fusion_cube_chunk_size: 32768 # int, weighted_cube/cube_mean 采样每块最大点数; 纯显存/吞吐不改数值; 仅限制前向瞬时尖峰(~0.45GB bf16), 对极端大样本鲁棒