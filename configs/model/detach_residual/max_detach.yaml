# @package _global_
# ============================================================
# detach_residual 组 / max_detach 预设
# ============================================================
# 本组统一持有 "梯度 detach 路由 + 头/refine 的 logit 接线(残差)" 这一类开关。
# 各键本身仍是 model.backbone.* 形参(透传进 VolumePointStage1Model.__init__),
# 其中 sparse_refine_residual_mode / sparse_refine_use_C_voxel_logits 在 sparse_refine_head
# 延迟实例化时注入 sparse_refine_head_cfg(见 src/model/stage1_model.py)。
#
# 使用: 实验在 defaults 里加 `- /model/detach_residual: max_detach` 即可整体覆盖
# model/default.yaml 中这 12 个键的中性默认; 不选本组时沿用中性默认。
# 设计动机见 CLAUDE/plans/implement/detach/00-grad-routing-heads-norm.md。
# 字段语义见 src/model/stage1_model.py 顶部 "detach 与 logit 残差" 契约。
# ============================================================
model:
  backbone:
    # === detach 路由(point→atom head 与 point→refine 解耦; 3 个正交开关) ===
    detach_real_point_feat_into_atomhead: false   # bool, 真实原子槽位喂最终 atom head 时是否 detach; false=受体监督训练 trunk
    detach_pseudo_point_feat_into_atomhead: false # bool, 伪原子(P)槽位喂最终 atom head 时是否 detach; false=P 监督训练 trunk
    detach_pseudo_point_feat_into_refine: true    # bool, P final point 特征喂 refine 时是否 detach; true=refine 隔墙只读, 自身损失不回灌 trunk
    detach_voxel_into_refine: true      # bool, 切断 refine->voxel 三处直接路径(base logits、C/P voxel_final)
    detach_voxel_feat_into_real_point: true   # bool, 真实原子接收采样 voxel 特征 detach
    detach_voxel_feat_into_pseudo_point: true # bool, 伪原子接收采样 voxel 特征 detach

    # === logit 残差接线 ===
    refine_receptor_from_voxel: false          # bool, atom logits 加 home 体素 voxel_aux detach 残差 base
    sparse_refine_residual_mode: residual       # str, refine 头 direct/residual 输出模式
    sparse_refine_use_C_voxel_logits: true     # bool, refine 头把 C 原始 logits 拼进输入(residual 模式也会读取 base)
