# @package _global_
# ============================================================
# 二分类 sigmoid 任务 preset
# 此文件由 base.yaml 的 defaults 或实验 override 载入; 模型输出字段写入 cfg.model.backbone, sparse_refine_task 写入顶层。
# 主要消费者:
#   → VolumePointStage1Model.__init__: 读取 atom_logit_dim / prior_prob / prior_probs。
#   → Stage1VoxelBackbone.__init__: 读取 voxel_backbone.* 输出通道与 prior_probs。
#   → sparse_refine 子配置: 通过 ${sparse_refine_task.*} 复用候选类别与 per-class 预算。
# ============================================================
model:
  backbone:
    # --- Atom / voxel 输出语义 ---
    atom_logit_dim: 1       # int, atom head 输出通道数; 1 表示二分类 sigmoid logit
    prior_prob: 0.01        # float|null, atom head sigmoid 正类先验; atom_logit_dim=1 时允许使用
    prior_probs: null       # list[float]|null, softmax 类别先验; 二分类 sigmoid 路径必须为 null
    voxel_backbone:
      voxel_aux_logit_dim: 1     # int, voxel aux head 输出通道数; 1 表示 sigmoid 辅助监督
      voxel_ligand_logit_dim: 1  # int, voxel ligand head 输出通道数; SparseCandidateSetBuilder 将其解释为 foreground 概率
      prior_probs: null          # list[float]|null, voxel 多分类先验; 单通道 sigmoid head 不使用该字段


# --- Sparse refine 二分类前景契约 ---
# 下列列表必须等长, 位置 0 对应 foreground class_id=1。
# candidate_set/anchor_sampler 配置通过 OmegaConf 插值读取这些字段, 保证 C 与 P 的类别顺序一致。
sparse_refine_task:
  candidate_class_ids: [1]                 # list[int], 候选前景类别 ID; 单通道 sigmoid 只允许 [1]
  warmup_topc_per_class: [35000]            # list[int], warmup 阶段每个 BOX/类别直接 top-k 进入候选 C 的上限
  adaptive_expand_factor: [8.0]           # list[float], adaptive_threshold 下相对 best-F1 正例数的候选扩张倍数
  max_candidate_voxels_per_class: [35000]  # list[int], 每个 BOX/类别候选 C 行数硬上限
  max_anchors_per_class: [1224]            # list[int], 每个 BOX/类别 P anchor 采样上限
