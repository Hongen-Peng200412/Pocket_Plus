# ============================================================
# 模型骨架配置 (结构性参数)
# ============================================================
# 此文件由 base.yaml 的 defaults 中 "- model: default" 引用
# 即使使用 sbatch 脚本也必须存在, 它为 Hydra 提供模型的结构参数
# 所有可调的子模块参数由 config group 文件提供, 不在此处定义
# ============================================================

name: default

# _target_: str, Wrapper 类; Hydra 据此实例化 Wrapper
_target_: src.wrappers.voxel_point_stage1.VoxelPointStage1Wrapper

backbone:
  _target_: src.model.stage1_model.VolumePointStage1Model
  atom_logit_dim: 1
  enable_recycling: false
  max_recycles: 1
  randomize_recycles: false
  detach_recycle_states: true
  act_layer_name: "gelu"
  ffn_type: "mlp"
  atom_head_ffn_type: "mlp"
  prior_prob: 0.01   # float|null, 单通道 sigmoid 正类先验概率; atom_logit_dim=1 时用于初始化 atom head bias
                     # → VolumePointStage1Model.__init__: 与 prior_probs 互斥; 多通道 atom head 禁止使用该字段
  prior_probs: null  # list[float]|null, 多通道 softmax 类别先验概率向量; 长度必须等于 atom_logit_dim 且总和为 1
                     # → VolumePointStage1Model.__init__: atom_logit_head bias 初始化为 log(prior_probs)

  # --- 在线 pdb_feature ---
  # 仅在 embed_head 未启用时生效; embed_head 启用时 forward() 的 elif 结构自动跳过
  online_pdb_feature: false           # bool, 是否在线 scatter raw atom_feat 到体素网格
  online_pdb_feature_reduce: "sum"    # str, scatter 聚合方式
  online_pdb_feature_dim: 49          # int, 原子原始特征维度

# --- 调度器与主监控指标 ---
# interval/frequency 仅用于完全交给 Lightning 管理的 scheduler。
# warmup_plateau 使用 cfg.train.scheduler 的显式字段: warmup 固定按 step, plateau 固定在每次 validation end 后读取 monitor_metric。
interval: "step"                   # str, Lightning-managed scheduler 更新间隔
frequency: 1                       # int, Lightning-managed scheduler 更新频率
monitor_metric: val/atom_pr_auc    # str, 主监控指标
                                   # → train.py: ModelCheckpoint.monitor
                                   # → VoxelPointStage1Wrapper.on_validation_epoch_end(): warmup_plateau plateau 读取该指标
monitor_mode: max                  # str, 主指标方向, 取值 max/min
                                   # → train.py: ModelCheckpoint.mode
                                   # → configs/train/B40_L3.yaml: scheduler.mode=${model.monitor_mode}
voxel_ligand_pr_auc_thresholds: 1024  # int | null, binned ligand PR-AUC 阈值数; 训练期默认 1024, 最终评估可显式覆盖为 4096
val_metric_device_policy: auto        # str, 验证 AP 更新设备策略; auto=非 binned 走 CPU 省显存, binned 走 GPU 加速阈值扫描

# --- Sparse refine loss 默认关闭 ---
# 下列字段由 VoxelPointStage1Wrapper.__init__ 保存并在 _compute_total_loss() 中消费。
ligand_sparse_refine_loss: null        # nn.Module|null, C 级 sparse refine loss; null 表示不计算 refined logits 监督
ligand_sparse_refine_loss_weight: 0.0  # float, schedule 关闭时的 sparse refine loss 权重
ligand_sparse_refine_loss_schedule: null # dict|null, 独立 linear warmup 配置; null 表示直接使用 ligand_sparse_refine_loss_weight
compile: false                     # bool, torch.compile
