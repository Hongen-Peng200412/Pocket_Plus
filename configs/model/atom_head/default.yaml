# @package _global_
# ============================================================
# Stage1 默认 atom head 配置
# base.yaml 默认加载本文件；实验可 override 为 stardard/none，但字段契约保持一致。
# ============================================================
model:
  backbone:
    atom_head_hidden_dim: 128
    atom_head_interaction_radius: 4.0
    atom_head_interaction_max_neighbors: 48
    atom_head_interaction_num_heads: 4
    atom_head_interaction_detach_source_feat: true
