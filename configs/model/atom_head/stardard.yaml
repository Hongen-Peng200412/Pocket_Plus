# @package _global_
# ============================================================
# Stage1 最终 atom head 配置
# 此文件写入 cfg.model.backbone.atom_head_*，由 VolumePointStage1Model.__init__ 传入 Stage1AtomHead。
# ============================================================
model:
  backbone:
    atom_head_hidden_dim: 128                     # int, real/pseudo 轻量分类尾部隐藏通道数
    atom_head_interaction_radius: 4.0             # float, real/P 双向 cross-attn 的 centered-world 邻域半径
    atom_head_interaction_max_neighbors: 48       # int, 每个 query 点最多保留的 source 邻居数
    atom_head_interaction_num_heads: 4            # int, cross-attn 头数; 必须整除 point backbone 输出通道数
    atom_head_interaction_detach_source_feat: true # bool, cross-attn 是否对 source 特征 detach
