# ============================================================
# Training Hyperparameters
# 此文件的所有配置项以 cfg.train.* 的形式被 train.py 和 Lightning wrappers 使用
# ============================================================

# --- DataLoader / Batch Size ---
global_batch_size: 40                       # int, 目标全局 batch size (per-device bs × devices × accumulate_steps)
                                            # → train.py: 据此反算 accumulate_grad_batches
enable_batch_size_tuning: true              # bool, 是否启用自动搜索 per-device batch_size
                                            # → true: 运行 Tuner.scale_batch_size() 搜索最大可用 bs
                                            # → false: 直接使用 batch_size 字段的预设值, 不做显存探测
tuning_init_batch_size: 10                   # int, 自动搜索时的起始探测值
batch_size: ${train.tuning_init_batch_size} # int, 实际 per-device batch_size
                                            # → 启用搜索时: 初始值无关紧要, 会被 tuner 覆写
                                            # → 不启用搜索时: 直接作为 per-device bs 使用
batch_size_tuning_safety_factor: 0.90        # float, 搜索到最大 bs 后的缩放安全系数, 建议值 0.7-0.85
tuning_steps_per_trial: 10                  # int, 每次尝试候选 bs 时运行的 step 数, 值越大判断越稳但搜索越慢
strict_global_batch_size: true              # bool, 是否严格对齐 global_batch_size
                                            # → true: 若 safe_bs × devices 不整除 global_batch_size,
                                            #   自动向下微调 per-device bs 直到整除, 保证 effective == target
                                            # → false: 保持 floor-div 行为, 允许 effective ≤ target
num_workers: 20
dataloader_backend: auto
pin_memory: true
seed: 3407
seed_workers: true
dataloader_seed_offsets:
  train: 0
  val: 1
resume_skip_train_batches: 0              # int, 完整续训首个 epoch 中各 rank 已经消费的 batch 数；普通训练为 0。
resume_skip_epoch: 0                      # int, 只在这个 epoch 应用 resume_skip_train_batches。

# --- Data Fault Tolerance ---
data_fault_tolerance:
  enabled: true
  stages:
    - train
    - val
  max_resample_attempts: 8
  sample_timeout_sec: 200
  log_first_n: 50

# --- Trainer ---
nnodes: 1
devices: 1
max_epochs: 20
accelerator: auto
ddp_find_unused_parameters: false
precision: "bf16-mixed"
gradient_clip_val: 0.5
check_val_every_n_epoch: 1
val_per_epoch: 3               # int, 每个 epoch 内等间隔验证次数; 1=仅 epoch 末验证
log_every_n_steps: 3

# --- Optimizer ---
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3.0e-5
  weight_decay: 0.01

# --- LR Scheduler ---
# scheduler: dict, 训练学习率调度器配置
#   → VoxelPointStage1Wrapper.configure_optimizers(): 构建 optimizer 与 step 级 warmup scheduler
#   → train.py: WarmupPlateauController 在 validation end 后读取 monitor_metric 并推进 ReduceLROnPlateau
scheduler:
  name: warmup_plateau        # str, 调度器模式; 先 warmup, 再按验证主指标 plateau 衰减
  total_steps: null           # int|null, 总 optimizer step 数; null 表示使用 trainer.estimated_stepping_batches
  warmup_steps: null          # int|null, warmup step 数; null 表示按 warmup_ratio * total_steps 计算
  warmup_ratio: 0.025         # float, warmup 占总 optimizer step 的比例; 仅 warmup_steps 为 null 时生效
  warmup_start_factor: 0.33   # float, warmup 起始学习率比例; LinearLR 从 lr*该比例升到 lr
  mode: ${model.monitor_mode} # str, plateau 指标方向; 与 cfg.model.monitor_mode 保持一致
  factor: 0.5                 # float, plateau 触发后学习率乘数
  patience: 3                 # int, PyTorch 原生 patience; 3 表示第 4 次 bad validation 衰减
  threshold: 2.0e-3           # float, 主指标改进阈值
  threshold_mode: abs         # str, 改进阈值模式; abs=绝对提升, rel=相对提升
  cooldown: 0                 # int, 衰减后跳过 plateau 计数的 validation 次数
  min_lr: 0.0                 # float|list[float], 学习率下界; 单 float 作用于所有 param group
  eps: 1.0e-8                 # float, ReduceLROnPlateau 判定学习率变化的最小差值
  stop_after_lr_reductions: null # int|null, 实际 LR 衰减达到该次数后由 train.py 停训; null 表示禁用
