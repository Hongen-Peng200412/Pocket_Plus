# AdaLigand Find CPC2 小增量训练制度。
# → 继承 CPC1 的数据与优化器，仅覆盖无 warmup、patience=1 和一次降 LR 后停止。
defaults:
  - stage1_cpc1
  - _self_

scheduler:
  name: warmup_plateau
  total_steps: null
  warmup_steps: 0
  warmup_ratio: 0.0
  warmup_start_factor: 1.0
  mode: ${model.monitor_mode}
  factor: 0.3
  patience: 1
  threshold: 0.001
  threshold_mode: abs
  cooldown: 0
  min_lr: 0.0
  eps: 1.0e-8
  stop_after_lr_reductions: 1
