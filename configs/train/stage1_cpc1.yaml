# AdaLigand Stage1 从头训练制度；unet_c1 与三个 Find/CPC1 共用。
# → src/train.py 构造 DataLoader/Trainer；wrapper.configure_optimizers() 消费 optimizer/scheduler。
defaults:
  - B40_L3
  - _self_

global_batch_size: 64               # 实际 preflight 若任一 Find 只能 batch=6，则五套配置整体切到 66。
enable_batch_size_tuning: false
batch_size: 8
strict_global_batch_size: true
num_workers: 16                     # int, 公共 YAML 中每个 DDP rank 的默认 Dataset worker 数; Find_1.sh 正式覆盖为每个 rank 30 workers, 双卡任务申请 64 CPU.
prefetch_factor: 4                  # int, 每个 worker 预取的 batch 数；只在 num_workers > 0 时传给 DataLoader。
pin_memory: true                    # bool, Linux 训练把 CPU Tensor 固定到页锁定内存后再传入 GPU。
dataloader_backend: torch
data_fault_tolerance:
  enabled: false                    # 冻结 BOX pool 不允许训练时跳样本或替换样本。
  stages: []
  max_resample_attempts: 0
  sample_timeout_sec: null
  log_first_n: 0

max_epochs: 70
precision: "bf16-mixed"
gradient_clip_val: 0.5
val_per_epoch: 12                    # int, 每个 epoch 等间隔执行 12 次完整 validation.
                                     # → src/train.py: 映射为 val_check_interval=1/12.

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5.0e-5
  weight_decay: 0.01

scheduler:
  name: warmup_plateau
  total_steps: null
  warmup_steps: null
  warmup_ratio: 0.005               # float, 从头训练阶段以估算总步数的 0.5% 线性 warmup。
  warmup_start_factor: 0.33
  mode: ${model.monitor_mode}
  factor: 0.2
  patience: 3                        # int, 连续第 3 次未改进时降低学习率。
  threshold: 0.003
  threshold_mode: abs
  cooldown: 0
  min_lr: 0.0
  eps: 1.0e-8
  stop_after_lr_reductions: 3
