# AdaLigand Stage1 从头训练制度；unet_c1 与三个 Find/CPC1 共用。
# → src/train.py 构造 DataLoader/Trainer；wrapper.configure_optimizers() 消费 optimizer/scheduler。
defaults:
  - B40_L3
  - _self_

global_batch_size: 64               # 实际 preflight 若任一 Find 只能 batch=6，则五套配置整体切到 66。
enable_batch_size_tuning: false
batch_size: 8
strict_global_batch_size: false       # bool, 禁止全局批量对齐逻辑向下改写显式物理 batch_size。
num_workers: 32                     # int, 单个 DataLoader 的 worker 进程数。
prefetch_factor: 4                  # int, 每个 worker 提前准备的物理 batch 数。
persistent_workers: false           # bool, false 表示每个训练周期重建 worker，使其读取当前请求表。
dataloader_backend: torch
data_fault_tolerance:
  enabled: false                    # 冻结 BOX pool 不允许训练时跳样本或替换样本。
  stages: []
  max_resample_attempts: 0
  sample_timeout_sec: null
  log_first_n: 0

max_epochs: 20
precision: "bf16-mixed"
gradient_clip_val: 0.5
val_per_epoch: 5                     # int, 按近似固定的训练 BOX 间隔，每个 epoch 等间隔执行 5 次完整 validation。
                                     # -> src/train.py: 映射为 val_check_interval=1/5。

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5.0e-5
  weight_decay: 0.01

scheduler:
  name: warmup_plateau
  total_steps: null
  warmup_steps: null
  warmup_ratio: 0.005               # float, 从头训练阶段以估算总步数的 0.5% 线性 warmup。
  warmup_start_factor: 0.33
  mode: ${model.monitor_mode}
  factor: 0.3
  patience: 2                        # int, 连续第 3 次未改进时降低学习率。
  threshold: 0.001
  threshold_mode: abs
  cooldown: 0
  min_lr: 0.0
  eps: 1.0e-8
  stop_after_lr_reductions: 3
