# @package _global_
# AdaLigand Find_2 / CPC1：56D density 与 56D Gaussian voxel embed 逐元素相加。
defaults:
  - /model/detach_residual: max_detach
  - override /model/voxel_backbone: stardard
  - override /model/point_backbone: stardard
  - override /model/fusion: e234d4
  - override /model/atom_head: stardard
  - override /model/task: binary
  - override /model/typed_point: "on"
  - override /model/embed_head: Find_2
  - override /model/sparse_refine/candidate_set: binary_adaptive
  - override /model/sparse_refine/anchor_sampler: unweighted_fps
  - override /model/sparse_refine/density_cube: both
  - override /model/sparse_refine/anchor_to_candidate: none
  - override /model/sparse_refine/sparse_refine_head: none
  - override /model/sparse_refine/anchor_class_conditioning: none
  - override /loss: stage1_find_cpc1
  - override /dataset: stage1_find
  - override /train: stage1_cpc1
  - override /frozen_module: adaligand_stage1
  - _self_

name: Find_2_CPC1
tag: "Find_2/CPC1"
experiment_group: "AdaLigand_Stage1/Find_2/CPC1"
project_name: AdaLigand_Stage1
init_from: null

dataset:
  stage1_model_name: Find_2

model:
  backbone:
    atom_logit_dim: 1
    enable_recycling: true
    max_recycles: 3
    randomize_recycles: true
    detach_recycle_states: true
    act_layer_name: "gelu"
    ffn_type: "gated"
    enable_atom_head: true
    enable_interface_norm: true
    voxel_backbone:
      aux_head_hidden_channels: 32
      ligand_head_hidden_channels: 32
      num_conv3d_aux: 0
      num_conv3d_ligand: 0
  class_names: ${dataset.class_names}
  monitor_metric: val_loss/global/total
  monitor_mode: min
  validation_diagnostics:
    enabled: true
