# @package _global_
# ============================================================
# 二分类 sparse refine 主实验
# 组合 C/P sparse refine 链路、四路 loss 与 foreground 监控指标。
# ============================================================

defaults:
  - override /model/task: binary
  - override /model/typed_point: "on"
  - override /model/voxel_backbone: stardard
  - override /model/point_backbone: stardard
  - override /model/fusion: d4321
  - override /model/atom_head: stardard
  - override /model/embed_head: clipbig
  - override /model/sparse_refine/candidate_set: binary_recorded
  - override /model/sparse_refine/anchor_sampler: unweighted_fps
  - override /model/sparse_refine/density_cube: default
  - override /model/sparse_refine/anchor_to_candidate: knn_message
  - override /model/sparse_refine/sparse_refine_head: default
  - override /model/sparse_refine/anchor_class_conditioning: none
  - override /loss: sparse_refine
  - override /dataset: emb_unet
  - override /train: B40_L3

name: sparse_refine000
tag: "sparse_refine000"
experiment_group: "ligand_sparse_refine"
project_name: PV_ligand_sparse_refine

# --- 二分类标签映射 ---
dataset:
  class_mapping: [0, 1, 1, 1, 1]       # list[int], 原始类别映射到 background/foreground
  class_names: [background, foreground] # list[str], logits/loss/metric 类别名顺序
  num_task_classes: 2                   # int, 任务类别数; 与 model/task=binary 对齐

# --- sparse refine 主监控指标 ---
model:
  backbone:
    # --- Recycle 机制 ---
    enable_recycling: true           # bool, 启用 recycle 循环(多轮迭代精化)
    max_recycles: 3                  # int, 最大 recycle 轮数
    randomize_recycles: true         # bool, 训练时在 [1, max_recycles] 内随机
    detach_recycle_states: true      # bool, 跨轮截断梯度

    # --- 统一激活函数 (全局源头, 子模块通过插值引用) ---
    act_layer_name: "gelu"           # str, "gelu"/"silu"/"relu"/"leakyrelu"
    ffn_type: "gated"                # str, PTV3 Block FFN: "mlp" / "gated"
    atom_head_ffn_type: "gated"      # str, atom head 可选 FFN: "mlp" / "gated" / "none"

    voxel_backbone:
      ligand_head_hidden_channels: 32
      aux_head_hidden_channels: 32
      num_conv3d_aux: 1              # int, aux_head 中 Conv3d(3x3)+ReLU 的对数
      num_conv3d_ligand: 1           # int, ligand_head 中 Conv3d(3x3)+ReLU 的对数

  class_names: ${dataset.class_names}
  monitor_metric: val_score/global/refined_F1
  monitor_mode: max
  validation_diagnostics:
    enabled: true

train:
  strict_global_batch_size: true
  val_per_epoch: 5
