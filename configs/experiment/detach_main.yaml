# @package _global_
# ============================================================
# 主实验: 全二分类 sparse refine + 最大 detach + density 残差关闭 + 大数据集
# ============================================================
# 设计动机见 CLAUDE/plans/implement/detach/00-grad-routing-heads-norm.md。
# "最大隔离"取值: voxel / point+前置头 / refine 三块尽量互不干扰(各 detach 开关见 model.backbone)。
# 用法:
#   sbatch sbatch/h200/1gpu.sbatch "+experiment=detach_main"
# ============================================================
defaults:
  - override /model/voxel_backbone: stardard
  - override /model/point_backbone: stardard
  - override /model/fusion: e234d4
  - override /model/atom_head: stardard
  - override /model/task: binary
  - override /model/typed_point: "on"
  - override /model/embed_head: clipbig
  - override /model/sparse_refine/candidate_set: binary_adaptive
  - override /model/sparse_refine/anchor_sampler: unweighted_fps
  - override /model/sparse_refine/density_cube: default
  - override /model/sparse_refine/anchor_to_candidate: knn_message
  - override /model/sparse_refine/sparse_refine_head: default
  - override /model/sparse_refine/anchor_class_conditioning: none
  - override /loss: sparse_refine
  - override /dataset: emb_unet
  - override /train: B40_L3


# --- 实验标识 ---
name: detach_main
tag: "detach_main"
experiment_group: "detach"        # str, run_dir 父文件夹名
project_name: PV_detach           # str, wandb 项目名


# --- 数据集: 全二分类(所有前景类合并为 1 类) ---
dataset:
  class_mapping: [0, 1, 1, 1, 1]  # list[int], 5 个原始类 -> 2 类映射; 索引 0=background, 1..4 合并为 foreground
  class_names: [background, foreground]  # list[str], (2,), task class 名, 与 logits 通道顺序一致
  num_task_classes: 2             # int, task 类别数


model:

  backbone:
    # --- Logit 输出 / recycle / 激活 ---
    atom_logit_dim: 1             # int, atom 二分类 logit 维度; refine_receptor 要求 == voxel_aux_logit_dim
    enable_recycling: true        # bool, 启用 recycle
    max_recycles: 3               # int, 最大 recycle 轮数
    randomize_recycles: true      # bool, 训练时在 [1, max_recycles] 内随机
    detach_recycle_states: true   # bool, 跨轮截断梯度
    act_layer_name: "gelu"        # str, 统一激活函数
    ffn_type: "gated"             # str, point backbone Block FFN
    atom_head_ffn_type: "gated"   # str, atom head Block FFN
    enable_atom_head: true        # bool, 构造 atom head(refine 需要 pseudo_feature, 必须开)


    # === 最大 detach: 三块解耦 ===
    enable_atom_head_front: true        # bool, point backbone 末端前置头(本实验唯一 atom 监督来源)
    enable_atom_head_back: false        # bool, 关闭 atom head 末端后置头(atom_logits=None)
    detach_real_point_feat: true        # bool, detach 真实原子槽位再喂后置头(本实验后置头已关)
    detach_pseudo_point_feat: true      # bool, detach pseudo 槽位, 切断 refine->point 直接路径
    detach_voxel_into_refine: true      # bool, 切断 refine->voxel 三处直接路径
    detach_voxel_feat_into_point: true  # bool, 切断 point-fusion->voxel 的二次回流
    refine_receptor_from_voxel: true    # bool, 前置头 logits 加 home 体素 voxel_aux detach 残差 base
    pseudo_density_residual: false      # bool, 本轮关闭 density 直通残差
    enable_interface_norm: true         # bool, 开启接口归一化(voxel→point/embed→point/density→point/sparse refine 源)


    voxel_backbone:
      ligand_head_hidden_channels: 32   # int, ligand head 隐藏通道
      aux_head_hidden_channels: 32      # int, aux(receptor) head 隐藏通道; refine_receptor 需要 aux head 启用
      num_conv3d_aux: 1                 # int, aux_head 中 Conv3d+ReLU 对数
      num_conv3d_ligand: 1              # int, ligand_head 中 Conv3d+ReLU 对数


  class_names: ${dataset.class_names}   # list[str], 与 dataset.class_names 对齐
  monitor_metric: val_score/global/refined_F1  # str, 主监控指标(refine 端到端 F1)
  monitor_mode: max
  validation_diagnostics:
    enabled: true                       # bool, refined_F1 等 CPC diagnostics 由此产出
  # --- sparse refine loss 调度: 硬 0 段延迟 refine 开始 ---
  ligand_sparse_refine_loss_schedule:
    warmup_ratio: 0.2                   # float, refine 权重从 start_on 线性升到 final 的窗口占比
    start_on_ratio: 0.1                 # float, global_step < 0.1*total 时 refine 权重硬等于 0


train:
  enable_batch_size_tuning: false       # bool, 关闭自动 batch size 搜索, 直接用 batch_size
  batch_size: 5                         # int, per-device batch size
  val_per_epoch: 5                      # int, 每 epoch 验证次数(warmup 窗口内需发生 validation 填阈值缓存)
