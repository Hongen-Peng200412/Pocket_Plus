# @package _global_
# ============================================================
# 实验: 模型上, 只用单纯的unet + 一半embed_head。损失上在 unet 的基础上加入辅助损失
# ============================================================
# 搭配 plus.yaml embed head + unfused_embed 数据集:
#   voxel_backbone 看到 EMDB + embed 49ch + occupancy 2ch
#   (pdb_feature 由 embed head 的 voxel_pdb_embed_grid 在线生成,
#    model.backbone.online_pdb_feature 被 elif 自动跳过)
#
# 基于新版数据 (emdb_exp_BOX)
# ============================================================
# 用法:
#   sbatch sbatch/h200/1gpu.sbatch "+experiment=exp000_baseline0"
# ============================================================

defaults:
  - override /model/voxel_backbone: stardard       # 体素分支: RAUNet-64
  - override /model/point_backbone: zeros       # 点云分支: PTV3 Dense
  - override /model/fusion: none                 # 融合: 4 层级全融合
  - override /model/atom_head: none            # Atom Head: 4 层
  - override /model/pseudo_atom: none            # 伪原子
  - override /model/typed_point: "on"              # typed point real/pseudo 分参
  - override /model/embed_head: voxel_abl0               # 完全没有
  - override /loss: emb_unet                  # 损失
  - override /dataset: emb_unet               # 数据集: 无离线 pdb_feature, embed head 在线生成
  - override /train: B40_L3                        # 训练: H200 参数


# --- 实验标识 ---
name: emb_unet_abl0
tag: "emb_unet_abl0"
experiment_group: "unet000"              # str, run_dir 父文件夹名称
project_name: PV_unet000                 # wandb 的项目名称

# --- 模型总体参数 ---
model:
  backbone:
    # --- atom head 关闭 ---
    enable_atom_head: false          # bool, 关闭 atom head; 不构建 atom_token_proj / atom_attention_stack / atom_logit_head

    # --- Logit 输出 ---
    atom_logit_dim: 1                # int, atom 分类 logit 维度; 二分类=1

    # --- Recycle 机制 ---
    enable_recycling: true           # bool, 启用 recycle 循环(多轮迭代精化)
    max_recycles: 3                  # int, 最大 recycle 轮数
    randomize_recycles: true         # bool, 训练时在 [1, max_recycles] 内随机
    detach_recycle_states: true      # bool, 跨轮截断梯度

    # --- 统一激活函数 (全局源头, 子模块通过插值引用) ---
    act_layer_name: "gelu"           # str, "gelu"/"silu"/"relu"/"leakyrelu"
    ffn_type: "gated"                # str, PTV3 Block FFN: "mlp" / "gated"
    atom_head_ffn_type: "gated"      # str, atom head 可选 FFN: "mlp" / "gated" / "none"

    
    voxel_backbone:
      ligand_head_hidden_channels: 32
      aux_head_hidden_channels: 32
      num_conv3d_aux: 2              # int, aux_head 中 Conv3d(3x3)+ReLU 的对数
      num_conv3d_ligand: 2           # int, ligand_head 中 Conv3d(3x3)+ReLU 的对数

  monitor_metric: val_score/global/voxel_ligand_PRAUC
  monitor_mode: max
  validation_diagnostics:
    enabled: false


# train:
#   strict_global_batch_size: true
#   val_per_epoch: 5
train:
  enable_batch_size_tuning: false 
  batch_size: 8
  val_per_epoch: 5
