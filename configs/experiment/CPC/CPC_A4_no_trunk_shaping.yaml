# @package _global_
# ============================================================
# CPC 消融 A4: 关闭 trunk 塑形(退回 max_detach 隔离) (最后重构代码.md §3)
# ============================================================
# 相对 CPC_main 只改一项: detach_*_point_feat_into_atomhead 改回 true(real+pseudo 进 atom head 都 detach)。
# 验证最不确定点: 让 atom+P 监督训练 trunk 是否真有益, 会否反而不稳。
# 用法: sbatch sbatch/h200/1gpu.sbatch "+experiment=CPC/CPC_A4_no_trunk_shaping"
# ============================================================
defaults:
  - /model/detach_residual: max_detach
  - override /model/voxel_backbone: stardard
  - override /model/point_backbone: stardard
  - override /model/fusion: e234d4
  - override /model/atom_head: stardard
  - override /model/task: binary
  - override /model/typed_point: "on"
  - override /model/embed_head: point_clipbig
  - override /model/sparse_refine/candidate_set: binary_adaptive
  - override /model/sparse_refine/anchor_sampler: unweighted_fps
  - override /model/sparse_refine/density_cube: both
  - override /model/sparse_refine/anchor_to_candidate: knn_message
  - override /model/sparse_refine/sparse_refine_head: default
  - override /model/sparse_refine/anchor_class_conditioning: none
  - override /loss: sparse_refine
  - override /dataset: MINI_emb_unet
  - override /train: B40_L3


name: CPC_A4_no_trunk_shaping
tag: "CPC_A4_no_trunk_shaping"
experiment_group: "CPC"
project_name: PV_CPC


dataset:
  class_mapping: [0, 1, 1, 1, 1]
  class_names: [background, foreground]
  num_task_classes: 2


model:
  backbone:
    atom_logit_dim: 1
    enable_recycling: true
    max_recycles: 3
    randomize_recycles: true
    detach_recycle_states: true
    act_layer_name: "gelu"
    ffn_type: "gated"
    atom_head_ffn_type: "gated"
    enable_atom_head: true
    enable_pseudo_ligand_head: true
    enable_interface_norm: true
    # === A4 消融轴: real+pseudo 进 atom head 都 detach(覆盖 max_detach 的 false), 退回最大隔离 ===
    detach_real_point_feat_into_atomhead: true   # bool, 真实原子槽位喂后置 atom head 时 detach(不再用受体监督塑形 trunk)
    detach_pseudo_point_feat_into_atomhead: true # bool, 伪原子槽位喂后置 atom head 时 detach(不再用 P 监督塑形 trunk)
    voxel_backbone:
      ligand_head_hidden_channels: 32
      aux_head_hidden_channels: 32
      num_conv3d_aux: 1
      num_conv3d_ligand: 1

  class_names: ${dataset.class_names}
  monitor_metric: val_score/global/refined_F1
  monitor_mode: max
  validation_diagnostics:
    enabled: true


train:
  enable_batch_size_tuning: false
  strict_global_batch_size: false
  global_batch_size: 39
  batch_size: 3
  val_per_epoch: 1
  scheduler:
    warmup_ratio: 0.06
