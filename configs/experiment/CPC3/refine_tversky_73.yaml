# @package _global_
# ============================================================
# CPC3 阶段三 refine 网格: tversky_73
# 启动命令:
#   python /home/penghongen/My_Project/Pocket_Plus/src/train.py +experiment=CPC3/refine_tversky_73 init_from=<stage2_run_dir或***>
# ============================================================
# 继承 CPC1/trunk_main 结构, 从 stage2 BEST.ckpt 初始化后仅训练 sparse refine。
defaults:
  - /experiment/CPC1/trunk_main
  - override /train: small_increment
  - override /frozen_module: stage3
  - _self_

name: refine_tversky_73
tag: "refine_tversky_73"
experiment_group: "CPC3"
init_from: "***"

model:
  monitor_metric: val_score/global/refined_F1
  ligand_sparse_refine_loss:
    tversky_alpha: 0.3
    tversky_beta: 0.7
    w_focal: 0.0
    w_tversky: 1.0
  ligand_sparse_refine_w_rank: 0.0
