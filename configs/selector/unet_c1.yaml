# ============================================================
# AdaLigand Stage1 Selector：unet_c1 / CCLN + V48+D（V-only）
# src/selector/train.py 直接读取本文件；启动后保存完整 resolved_config.yaml
# ============================================================

stage1_model_name: unet_c1
selector_variant: ccln_v48d_oracle                # str, src/selector/train.py 构造 V-only CCLN + V48+D

paths:
  stage1_outputs_root: "/path/to/stage1_outputs" # str, 读取 Stage1 probability/components/centered 正式 artifact 的根
  upstream_root: "/path/to/Ori_Data"             # str, 读取 experimental density 的 A–G 数据根
  selector_run_dir: "/path/to/selector_outputs/unet_c1/ccln_v48d_oracle/run_001" # str, Selector run 输出根
  input_CLG_list_path: null                       # str|null, null 时由 freeze_input_clg_list 扫描并冻结清单
  expected_validation_pdb_ids_path: null          # str|null, formal_run=true 时必须为固定 validation PDB 清单

data:
  split_order: [train, validation, calibration]   # list[str], 冻结 input_CLG_list.json 的 split 顺序
  formal_run: false                               # bool, false 只发布 TRIAL_BEST.ckpt；正式 run 必须改 true 并给 validation 清单
  selector_seed: 20260720                         # int, 统一控制初始化、shuffle 与 DataLoader worker
  lambda_count: 0.05                              # float, oracle 与预测反链每个节点的计数惩罚
  density_clip_percentile: [0.001, 0.999]         # list[float], exp_clipnorm_nopost 的两端 clip 分位
  pdb_cache_size: 1                               # int, 每个 worker 的 PDB 聚合 bundle LRU 容量

model:
  modalities: [V]                                # list[str], unet_c1 只消费真实 V，不创建 P/A 占位
  A_source_order: []                              # list[str], V-only 时必须为空
  P_source_order: []                              # list[str], V-only 时必须为空
  hidden_dim: 128
  num_heads: 4
  tree_layers: 2
  tree_ffn_hidden_dim: 256
  candidate_attribute_dim: 16
  modality_projected_dim: 64                     # 无 P/A 时不实例化对应 adapter
  modality_gate_hidden_dim: 128
  dropout: 0.1
  probability_epsilon: 1.0e-6

  V_output_dim: 48
  V_meta_dim: 2
  V_correction_gate_hidden_dim: 128
  use_density_context: true

  density_input_shape_zyx: [80, 80, 80]            # list[int], BOX-local 离散 voxel 网格尺寸 ZYX
  density_channels: [32, 64, 64, 128]             # list[int], 80→40→20→10 四层通道
  density_bottleneck_heads: 4                     # int, 10³ 最低分辨率 Transformer head 数
  density_bottleneck_layers: 1                    # int, 最低分辨率 Transformer 层数
  density_bottleneck_ffn_dim: 256                 # int, 最低分辨率 Transformer FFN hidden dim

loss:
  condition_weighting: oracle
  gamma_focal: 0.0
  w_CLG: 1.0
  w_blob: 1.0                                    # L_blob 对正、负 CLG 始终训练
  w_antichain: 1.0
  smooth_l1_beta: 1.0

optimizer:
  learning_rate: 3.0e-4
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  plateau_factor: 0.3
  plateau_patience: 3
  plateau_threshold: 0.001

train:
  device: cuda
  batch_size: 1
  num_workers: 2
  pin_memory: true
  max_epochs: 20

