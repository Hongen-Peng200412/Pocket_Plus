# ============================================================
# AdaLigand unet_c1 Dataset
# → src/train.py::UnifiedDataModule.setup()；仍构造 auxiliary target，但不返回原子表。
# ============================================================
# _target_: str, 与 Find 共用的统一 80³ Dataset 类全名。
_target_: src.datasets.stage1_dataset.Stage1Dataset
name: stage1_unet_c1

all_data_path: ${oc.env:ADALIGAND_DATA_ROOT,/storage/penghongen/AdaLigand/Ori_Data}
box_pool_root: ${oc.env:ADALIGAND_STAGE1_PREPARATION_ROOT,/storage/penghongen/AdaLigand/Ori_Data/stage1_preparation_box_pool_3}/box_pool
split_train: ${dataset.box_pool_root}/train
split_val: ${dataset.box_pool_root}/validation_selection_pdb_centric_v2.npz  # 方式三独立验证产物；固定全部 200 个 validation PDB，不覆盖 V1。

stage1_model_name: unet_c1  # str, 选择单通道 density recipe 和无原子表输出。
class_names: [background, foreground]
atom_buffer_radius: 8.0             # 只用于构造 hardmask/voxel_label；原子表不返回给模型。
request_seed: 3407
pdb_foreground_box_num: 50                     # int, 每个 PDB 的目标 bias BOX 数量；occurrence 不足时允许实际数量低于 50。
pdb_foreground_fraction_target: 0.7575757575757576  # float, 目标比例 25/33；换算为每个 PDB 固定抽取 16 个 context BOX。
pdb_occurrence_foreground_box_cap: 1           # int, 单个 occurrence 每个 epoch 至多抽取 1 个 bias BOX。
cache_max_bytes: 34359738368  # int, 每个 worker 的 mmap 与小型资产 LRU 逻辑上限；不会预分配 32 GiB 内存。
enable_random_rotation: true

density_channel_config:
  clip_percentile: [0.001, 0.999]
  fit_mask_percentile: 0.003
  enabled_channels: [exp_clipnorm_nopost]
