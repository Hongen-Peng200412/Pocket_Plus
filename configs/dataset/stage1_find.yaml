# ============================================================
# AdaLigand Find 共用 Dataset
# → src/train.py::UnifiedDataModule.setup() 通过 Hydra 分别实例化 train/val Dataset。
# ============================================================
# _target_: str, 统一 80³ Dataset 类全名。
_target_: src.datasets.stage1_dataset.Stage1Dataset
name: stage1_find

# A—G 权威整图资产与 Stage1 冻结请求索引；环境变量只替换部署根目录。
all_data_path: ${oc.env:ADALIGAND_DATA_ROOT,/storage/penghongen/AdaLigand/Ori_Data}
box_pool_root: ${oc.env:ADALIGAND_STAGE1_PREPARATION_ROOT,/storage/penghongen/AdaLigand/Ori_Data/stage1_preparation}/box_pool
split_train: ${dataset.box_pool_root}/train
split_val: ${dataset.box_pool_root}/validation_selection.npz

stage1_model_name: Find_0  # str, producer recipe；Find_1 实验配置会覆盖为 Find_1。
class_names: [background, foreground]
atom_buffer_radius: 8.0
request_seed: 3407
cache_max_bytes: 536870912
enable_random_rotation: true

density_channel_config:
  clip_percentile: [0.001, 0.999]
  fit_mask_percentile: 0.003
  # 权威 ALL 顺序必须显式进入 resolved config：op → norm → post。
  enabled_channels:
    - exp_nonorm_nopost
    - exp_nonorm_gauss1
    - exp_nonorm_gauss2
    - exp_nonorm_DoG1
    - exp_nonorm_DoG2
    - exp_nonorm_smooth1
    - exp_nonorm_smooth2
    - exp_clipnorm_nopost
    - exp_clipnorm_gauss1
    - exp_clipnorm_gauss2
    - exp_clipnorm_DoG1
    - exp_clipnorm_DoG2
    - exp_clipnorm_smooth1
    - exp_clipnorm_smooth2
    - sim_nonorm_nopost
    - sim_nonorm_gauss1
    - sim_nonorm_gauss2
    - sim_nonorm_DoG1
    - sim_nonorm_DoG2
    - sim_nonorm_smooth1
    - sim_nonorm_smooth2
    - sim_clipnorm_nopost
    - sim_clipnorm_gauss1
    - sim_clipnorm_gauss2
    - sim_clipnorm_DoG1
    - sim_clipnorm_DoG2
    - sim_clipnorm_smooth1
    - sim_clipnorm_smooth2
    - diff_nonorm_nopost
    - diff_nonorm_gauss1
    - diff_nonorm_gauss2
    - diff_nonorm_DoG1
    - diff_nonorm_DoG2
    - diff_nonorm_smooth1
    - diff_nonorm_smooth2
    - diff_clipnorm_nopost
    - diff_clipnorm_gauss1
    - diff_clipnorm_gauss2
    - diff_clipnorm_DoG1
    - diff_clipnorm_DoG2
    - diff_clipnorm_smooth1
    - diff_clipnorm_smooth2
    - posdiff_nonorm_nopost
    - posdiff_nonorm_gauss1
    - posdiff_nonorm_gauss2
    - posdiff_nonorm_DoG1
    - posdiff_nonorm_DoG2
    - posdiff_nonorm_smooth1
    - posdiff_nonorm_smooth2
    - posdiff_clipnorm_nopost
    - posdiff_clipnorm_gauss1
    - posdiff_clipnorm_gauss2
    - posdiff_clipnorm_DoG1
    - posdiff_clipnorm_DoG2
    - posdiff_clipnorm_smooth1
    - posdiff_clipnorm_smooth2
