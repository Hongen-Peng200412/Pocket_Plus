# Find_1 PDB-centric-2: 增加 PDB 覆盖, 每个 occurrence 每个 epoch 最多贡献一个 bias BOX.
defaults:
  - stage1_find
  - _self_

name: stage1_find_pdb_centric_2
split_val: ${dataset.box_pool_root}/validation_selection_pdb_centric_v2.npz
pdb_foreground_box_num: 50
pdb_foreground_fraction_target: 0.7575757575757576  # float, 25/33; 对应每个 PDB 固定抽取 16 个 context BOX.
pdb_occurrence_foreground_box_cap: 1
