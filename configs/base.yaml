# ============================================================
# Hydra 根配置 (所有实验的基础)
# ============================================================
# 此文件是 Hydra 的顶层入口, 即使使用 sbatch 脚本也必须存在. 但是本文件可以完全不动——————它就是被 override 的
# 用法:
#   python Pocket_Plus/src/train.py +experiment=exp001_baseline
#   sbatch sbatch/h200/1gpu.sbatch "+experiment=exp001_baseline"
# ============================================================

defaults:
  # --- 模型骨架 ---
  - model: default                             # Wrapper/_target_/recycle 等结构参数

  # --- 模型子模块 (各自独立可替换) ---
  - model/voxel_backbone: default              # 体素分支
  - model/point_backbone: default              # 点云分支
  - model/fusion: default                      # 融合逻辑
  - model/atom_head: default                   # atom head
  - model/pseudo_atom: none                    # 伪原子(默认关闭)
  - model/typed_point: "on"                      # typed point real/pseudo 分参(默认开启)
  - model/task: binary                         # 模型任务 preset: binary(sigmoid) / tri(softmax)
  - model/sparse_refine: default               # sparse refine 总入口
  - model/sparse_refine/candidate_set: none    # sparse candidate set C(默认关闭)
  - model/sparse_refine/anchor_sampler: none   # sparse P anchor sampler(默认关闭)
  - model/sparse_refine/density_cube: none     # P anchor density cube encoder(默认关闭)
  - model/sparse_refine/anchor_to_candidate: none  # P -> C KNN 消息边(默认关闭)
  - model/sparse_refine/sparse_refine_head: none   # C refined logits head(默认关闭)
  - model/sparse_refine/anchor_class_conditioning: none  # P 来源类别条件化(默认关闭)
  - model/embed_head: passthrough              # embed head(默认透传)

  # --- 损失函数 ---
  - loss: focal_default                        # Focal Loss

  # --- 数据 / 后处理 / 输出 ---
  - dataset: fused
  - post_process: none
  - output: standard

  # --- 训练超参数 ---
  - train: B40_L3
  - frozen_module: none

  - _self_


# --- 全局标签(由 experiment 覆盖) ---
name: base
tag: "默认"
project_name: PV_default
experiment_group: "default"          # str, run_dir 父文件夹名, 建议由 experiment 覆盖
wandb_log_LongName: false

# --- 运行控制 ---
min_duration: 0
keep_short_runs: true
offline: false
migrate_slurm_logs: false
init_from: null                    # str|null, model-only 初始化来源; `.ckpt` 文件或含 checkpoints/BEST.ckpt 的 run 目录

hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
