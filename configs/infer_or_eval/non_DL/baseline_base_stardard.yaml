defaults:
  - _self_

# ============================================================
# 非深度学习 baseline 基础配置(stardard 系统)
# 由 run_baseline_two_stage.py 加载: 枚举 6 个 baseline_name, 用 derive_baseline_paths 派生
# output_root / cache_root / vis_output_root / error_dir / raw_pairs_json, 再走与 DL 同构的
# 40 Stage1 -> 40 Stage2 -> 110 fixed test 流程(model=None, 靠预生成 cache 命中, 绝不 forward)。
# 本文件只放 stardard 系统的输入来源与后处理/搜索默认值; 路径与 baseline_name 由 runner 注入。
# ============================================================

# --- 运行模式 ---
mode: "voxel_param_search"   # str, 固定; run_voxel_param_search 复用 DL 同一套后处理/扫参/评估

# --- baseline 身份(由 runner 注入) ---
baseline_name: null          # str|null, 6 个 baseline 之一; build_baseline_cache 据此选 density channel 或 phenix
system: "stardard"           # str, 系统名; 仅写入 cache meta

# --- 路径(由 runner 的 derive_baseline_paths 注入, 不在此写死) ---
raw_pairs_json: null         # str|null, 样本列表 JSON; runner 按 split 设为 protein_40 / protein_110
output_root: null            # str|null, 当前 baseline×system×split 输出根目录
cache_root: null             # str|null, baseline cache 根目录; build_baseline_cache 与 run 阶段共用
vis_output_root: null        # str|null, 可视化根目录; raw 差图 sidecar 也写在此处按 sample 分目录
error_dir: null              # str|null, 结构解析/GT 失败错误目录
ckpt_path: null              # str|null, baseline 不需要 checkpoint; model=None
device: "cuda:0"             # str, 占位; baseline 不 forward, 实际不使用 GPU
cache_data_mode: "memory"    # str, 搜索阶段缓存读取模式; memory 一次性预加载全部缓存
use_cache: true              # bool, baseline cache 已预生成, 命中即用
save_cache: true             # bool, 保留与 DL 工作流一致的开关
show_progress: true          # bool, 是否显示进度条

# --- raw 输入构造参数(build_baseline_cache 读取) ---
target_voxel_size: 1.0       # float, 密度图重采样目标体素大小
compute_density: true        # bool, 是否计算原子局部密度特征
select_first_model: true     # bool, 多 model 结构处理策略
filter_preset: "five_class"  # str, structure GT 与可视化的配体筛选预设名

# ------------------------------------ 网络与GT的来源(stardard) --------------------------------------
structure_input_source: "cif_gt_path"   # str, baseline 结构输入字段名(stardard 用真实结构)
sim_map_source: "sim_map_path"          # str, baseline 模拟图字段名(stardard 用 receptor 模拟图)
gt_receptor_source: "cif_gt_path"       # str, structure GT 受体结构字段名

# --- 可由逐样本 pair 覆盖的字段 ---
class_mapping: null          # list[int]|null, 类别映射; null 时按二分类前景处理
labels_npz_path: null        # str|null, 全局默认 labels.npz; pair 同名字段非 null 时逐样本覆盖

# --- 后处理基准参数(stage 构造函数会覆盖关键项, 其余 advanced 项作为占位被 _postprocess_params_from_cfg 读取) ---
filter_strength: "basic"     # str, baseline 固定 basic
threshold: 0.05              # float, 占位; 各阶段由 stage 构造函数设定
min_component_voxels: 10     # int, 连通域最小体素数
connectivity_policy: "7_none" # str, 初始连通域邻接策略
merge_dist: 5.0              # float, 占位; stage1=0.0 / stage2,test=5.0
sigma_nearby: 1.0            # float, advanced 占位(basic 不使用)
kernel_nearby: 3             # int, advanced 占位
sigma_response: 1.0          # float, advanced 占位
kernel_response: 3           # int, advanced 占位
score_add: 1.0               # float, advanced 占位
score_minus: 1.0             # float, advanced 占位
voxel_score_min: 0.0         # float, advanced 占位
instance_score_min: 0.0      # float, advanced 占位
fixed_search_params: []      # list[str], 强制固定的后处理参数名
search_space_by_class: {}    # dict[str,dict], 多分类逐类搜索覆盖; baseline 二分类不用

# --- GT 评估 ---
eval_gt: true                     # bool, baseline 必须构造 GT 才能扫阈值/评估
ligand_gt_distance_threshold: 1.7 # float, ligand GT 距离阈值(Å)

# --- 搜索器参数(stage 构造函数会覆盖 search_strategy/objective_expr/search_space) ---
search_strategy: "grid"      # str, 搜索策略
n_jobs: 16                   # int, 后处理评估并行 worker 数
max_iter: 30                 # int, differential_evolution 迭代数(grid 不用)
popsize: 8                   # int, differential_evolution 种群倍率(grid 不用)
random_seed: 42              # int, differential_evolution 随机种子(grid 不用)
objective_expr: "avg_voxel_f1"  # str, 占位; 各阶段由 stage 构造函数设定
search_space:                # dict, 占位; 各阶段由 stage 构造函数覆盖
  threshold: {type: float, min: 0.0, max: 1.0, step: 0.01}

# --- baseline 高分位阈值网格(rank 均衡后分布近似 [0,1] 均匀, 信号集中在极高分位; 覆盖 two_stage stage builder 默认) ---
stage1_search_space: {type: float, min: 0.97, max: 1.0, step: 0.0001}  # dict, Stage1 threshold 网格(301 点)
stage2_threshold_window_halfwidth: 0.001  # float, Stage2 局部窗口半宽(best ± 0.001)
stage2_threshold_step: 0.0001             # float, Stage2 threshold 步长(21 点局部窗)

# --- 逐样本字段占位 ---
cif_path: null               # str|null, 结构文件路径; 由 raw_pairs_json 逐样本提供
map_path: null               # str|null, 实验密度图路径; 由 raw_pairs_json 逐样本提供
sim_map_path: null           # str|null, receptor 模拟密度图路径; 由 raw_pairs_json 逐样本提供
sim_map_path_cryoatom: null  # str|null, cryoatom 模拟密度图路径; strict 系统使用
cif_gt_path: null            # str|null, 真实结构路径; 由 raw_pairs_json 逐样本提供
phenix_output_root: null     # str|null, phenix 预生成差图根目录; 仅 phenix baseline 用, 由 runner 注入(A2 约定派生, 不写 JSON 字段)
sample_name: null            # str|null, 样本名; null 时回退 Path(cif_path).stem
vis_enable: true             # bool, 占位; 各阶段由 stage 构造函数设定

# --- Hydra 运行目录行为 ---
hydra:
  job:
    chdir: false             # bool, 保持进程 cwd 不被 Hydra 切换
